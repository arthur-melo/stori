name: stori_frontend

services:
  stori_frontend_prod:
    container_name: stori_frontend_prod
    build:
      context: .
    restart: always
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=8080
    ports:
      - 8080:8080
    networks:
      - stori
    volumes:
      - stori_frontend_data_prod:/app/.next
    profiles: [prod]

  stori_frontend_dev:
    container_name: stori_frontend_dev
    build:
      context: .
      target: deps
    command: npm run dev
    environment:
      - NODE_ENV=development
      - PORT=8080
    ports:
      - 8080:8080
    networks:
      - stori
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    profiles: [dev]

  stori_frontend_test:
    container_name: stori_frontend_test
    build:
      context: .
      target: deps
    command: npm run test
    environment:
      - NODE_ENV=test
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    profiles: [test]

networks:
  stori:
    name: stori

volumes:
  stori_frontend_data_prod:
    driver: local
